<!DOCTYPE html>

<html>
<head>

    <title>Criar conta</title>
    <link rel="stylesheet" type="text/css" href="../../res/styles/style.css">

</head>

<body id="login">

    <header class="header" id="header">
        <a class="logo" id="logo">Cursini</a>
        <nav class="navbar" id="navigationbar">
            <a href="../login/login.html">Entrar</a>
            <a href="../about/about.html">Sobre nós</a>
        </nav>
    </header>

    <div id="wrapper">
        <form action="login.html">
            <h1>Criar conta</h1>
            <div id="input-box">
                <label for="Accusername">Nome de usuário</label>

            <div id="input-box">

        </form>
    </div>
